name: Whetstone
options:
  bundleIdPrefix: com.zhengyangxu
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.2"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Whetstone:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Whetstone
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: KeychainAccess
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengyangxu.whetstone
        PRODUCT_NAME: Whetstone
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: Whetstone
        INFOPLIST_KEY_NSAppTransportSecurity: "{NSAllowsArbitraryLoads = YES;}"
        # Sparkle 自动更新 — appcast 跟 DMG 一起作为 GH release asset 发布。
        # 公钥用于校验下载的 DMG 没被中间人改过;私钥仅在 GH Actions secret。
        INFOPLIST_KEY_SUFeedURL: https://github.com/oliverxuzy-ai/Whetstone/releases/latest/download/appcast.xml
        INFOPLIST_KEY_SUPublicEDKey: YD2eyoshST6Rpttk+WhHAglopfGEk/If/Di92omJhhc=
        CODE_SIGN_ENTITLEMENTS: Whetstone/Whetstone.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
