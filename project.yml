name: Whetstone
options:
  bundleIdPrefix: com.zhengyangxu
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  WhetstoneCore:
    path: Packages/WhetstoneCore

targets:
  Whetstone:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Whetstone
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"     # xcodegen 生成的 Info.plist 不当 source 编进 bundle
    dependencies:
      - package: Sparkle
      - package: WhetstoneCore
    # 用 xcodegen 显式生成 Info.plist (而不是 GENERATE_INFOPLIST_FILE),
    # 因为 Sparkle 的 SUFeedURL / SUPublicEDKey 是自定义 key,Xcode 的
    # INFOPLIST_KEY_* 机制只认 Apple 已知的 key,自定义会被静默丢弃 →
    # 之前 v0.4.0 的 Info.plist 缺这两个,Sparkle 报 "Update Error: must
    # specify SUFeedURL"。
    info:
      path: Whetstone/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.education
        CFBundleDisplayName: Whetstone
        # 版本必须引用 build setting (而不是 xcodegen 的默认硬编 "1.0"),
        # 这样 CI 里 sync-version.sh 改 MARKETING_VERSION 就能传到 plist,
        # Sparkle 才能正确对比当前 vs appcast 版本。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Sparkle 自动更新 — appcast 跟 DMG 一起作为 GH release asset 发布。
        # 公钥用于校验下载的 DMG 没被中间人改过;私钥仅在 GH Actions secret。
        SUFeedURL: https://github.com/oliverxuzy-ai/Whetstone/releases/latest/download/appcast.xml
        SUPublicEDKey: YD2eyoshST6Rpttk+WhHAglopfGEk/If/Di92omJhhc=
        # 沙盒应用必需 — 让 Sparkle 通过 Installer Launcher XPC 服务安装更新。
        # 配合 entitlements 里的 mach-lookup 例外(<bundleid>-spks/-spki);
        # 缺这一项,沙盒下更新会报 "launching the installer" 失败。
        SUEnableInstallerLauncherService: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhengyangxu.whetstone
        PRODUCT_NAME: Whetstone
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Whetstone/Whetstone.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
